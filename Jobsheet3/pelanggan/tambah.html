<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIRENMO | Tambah Pelanggan</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>SIRENMO</h1>
        <input type="checkbox" id="nav-toggle" class="nav-toggle">
        <label for="nav-toggle" class="nav-toggle-label">&#9776;</label>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="../mobil/list.html">Daftar Mobil</a></li>
                <li><a href="list.html">Daftar Pelanggan</a></li>
                <li><a href="tambah.html">Tambah Pelanggan</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Tambah Pelanggan</h2>
            <form>
                <p>
                    <label for="nama">Nama</label><br>
                    <input type="text" id="nama" name="nama" required>
                </p>
                <p>
                    <label for="alamat">Alamat</label><br>
                    <input type="text" id="alamat" name="alamat" required>
                </p>
                <p>
                    <label for="telepon">No. Telepon</label><br>
                    <input type="text" id="telepon" name="telepon" required>
                </p>
                <p>
                    <label for="email">Email</label><br>
                    <input type="email" id="email" name="email" required>
                </p>
                <p>
                    <label for="jaminan">Jaminan</label><br>
                    <select id="jaminan" name="jaminan">
                        <option value="KTP">KTP</option>
                        <option value="SIM">SIM</option>
                        <option value="KTM">KTM</option>

                    </select>
                </p>
                <p>
                    <button type="submit">Simpan</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIRENMO &mdash; Jobsheet 3</p>
    </footer>
</body>
</html>
